name: Compile Firmware

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli config set library.enable_unsafe_install true

      - name: Install Teensy Core
        run: |
          arduino-cli core update-index
          arduino-cli core install teensy:avr

      - name: Install Libraries from Arduino Library Manager
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "MIDI Library"
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli lib install "MD_MIDIFile"
          # MD_MIDIFile defaults to USE_SDFAT=0 (standard Arduino File type), but the
          # sketch uses the Teensy SdFat API. Patch the config to enable SdFat mode.
          find ~/Arduino/libraries/MD_MIDIFile -name "MD_MIDIFile_config.h" \
            -exec sed -i 's/#define USE_SDFAT 0/#define USE_SDFAT 1/' {} \;

      - name: Install debounce library from source
        # kimballa/button-debounce: provides debounce.h with Button(id, callback),
        # BTN_PRESSED/BTN_OPEN constants, and update(bool). Not in Arduino Library Manager.
        run: |
          arduino-cli lib install --git-url https://github.com/kimballa/button-debounce.git

      - name: Compile Teensy 4.1 Firmware
        run: |
          arduino-cli compile \
            --fqbn teensy:avr:teensy41 \
            --warnings all \
            midicontroller/midicontroller.ino
