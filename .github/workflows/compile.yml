name: Compile Firmware

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli config set library.enable_unsafe_install true

      - name: Install Teensy Core
        run: |
          arduino-cli core update-index
          arduino-cli core install teensy:avr

      - name: Install Libraries from Arduino Library Manager
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "MIDI Library"
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli lib install "MD_MIDIFile"

      - name: Install debounce library from source
        # debounce.h (Button class with BTN_PRESSED/BTN_OPEN) is not published
        # in the Arduino Library Manager index, so install directly from git.
        run: |
          arduino-cli lib install --git-url https://github.com/ElevenTimes/Debounce.git

      - name: Compile Teensy 4.1 Firmware
        run: |
          arduino-cli compile \
            --fqbn teensy:avr:teensy41 \
            --warnings all \
            midicontroller/midicontroller.ino
