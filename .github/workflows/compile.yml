name: Compile Firmware

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://www.pjrc.com/teensy/package_teensy_index.json

      - name: Install Teensy Core
        run: |
          arduino-cli core update-index
          arduino-cli core install teensy:avr

      - name: Install Required Libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "MIDI Library"
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli lib install "MD_MIDIFile"
          arduino-cli lib install "Debounce"

      - name: Compile Teensy 4.1 Firmware
        run: |
          arduino-cli compile \
            --fqbn teensy:avr:teensy41 \
            --warnings all \
            midicontroller/midicontroller.ino
